name: End-to-end tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          build: yarn build
          start: yarn start
          wait-on: "http://localhost:3000"
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dgxtqvcswgkvcdbjlmpw.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_OqozI37MOxoOwpFOWldbyQ_YuPo9AWT
          OPENAI_API_KEY: ${{secrets.OPENAI_API_KEY}}